<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Happy Valentine's Day!</title>
    <style>
      body {
        background-color: #ffe6e6;
        font-family: "Times New Roman", Times, serif;
        text-align: center;
        margin: 0;
        padding: 0;
        position: relative;
        overflow: hidden;
      }
      h1 {
        margin-top: 100px;
        font-size: 2.5em;
        color: #cc0000;
        position: relative;
        z-index: 1;
      }
      .gif-container {
        margin-top: 20px;
        position: relative;
        z-index: 1;
      }
      .gif-container img {
        max-width: 80%;
        height: auto;
        border: 5px solid #cc0000;
        border-radius: 10px;
      }
      /* Style for the digital birds */
      .bird {
        position: absolute;
        width: 50px;
        height: 50px;
        transition: top 2s linear, left 2s linear;
        pointer-events: none; /* So they don't interfere with clicking */
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <h1>Love you always my beautiful dove!</h1>

    <!-- Digital birds. You can add or remove as many as you like! -->
    <img
      class="bird"
      src="https://media4.giphy.com/media/sYXDaJ35XqCuKCYQOb/200w.gif?cid=6c09b9528tg9ikyq88jytd07glusitul7boge4b120ewx0to&ep=v1_stickers_search&rid=200w.gif&ct=s"
      alt="Digital Bird"
    />
    <img
      class="bird"
      src="https://media.tenor.com/0hf8dxXCKggAAAAj/dove.gif"
      alt="Digital Bird"
    />
    <img
      class="bird"
      src="https://media.tenor.com/0hf8dxXCKggAAAAj/dove.gif"
      alt="Digital Bird"
    />
    <img
      class="bird"
      src="https://media4.giphy.com/media/sYXDaJ35XqCuKCYQOb/200w.gif?cid=6c09b9528tg9ikyq88jytd07glusitul7boge4b120ewx0to&ep=v1_stickers_search&rid=200w.gif&ct=s"
      alt="Digital Bird"
    />

    <div class="gif-container">
      <!-- Insert your GIF below! Replace the URL with your chosen GIF -->
      <img
        src="https://media.tenor.com/u56nhKZD24AAAAAi/catkiss-cat.gif"
        alt="Valentine's Day Gif"
      />
    </div>

    <script>
      // Function to move each bird to a new random location within the viewport.
      function moveBirds() {
        const birds = document.querySelectorAll(".bird");
        birds.forEach((bird) => {
          // Calculate maximum x/y coordinates so the bird stays fully in view.
          const maxX = window.innerWidth - bird.offsetWidth;
          const maxY = window.innerHeight - bird.offsetHeight;
          const randX = Math.floor(Math.random() * maxX);
          const randY = Math.floor(Math.random() * maxY);
          bird.style.left = randX + "px";
          bird.style.top = randY + "px";
        });
      }

      // Move birds initially once the page loads.
      moveBirds();
      // Then update their positions every 2 seconds.
      setInterval(moveBirds, 2000);
    </script>
  </body>
</html>
